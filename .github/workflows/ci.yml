name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: >
          python -c "import allensdk, pandas, sklearn, umap; import json;
          json.load(open('cells.json')); print(pandas.read_csv('ephys_features.csv').shape)"
